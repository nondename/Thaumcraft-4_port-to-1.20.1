plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Keep the complete 1.12.2 source and test trees in place as porting references.
// Only the modern source sets are compiled for Minecraft 1.20.1.
sourceSets {
    main {
        java.srcDirs = ['src/modern/java']
        resources.srcDirs = ['src/modern/resources', 'src/generated/resources']
    }
    test {
        java.srcDirs = ['src/modernTest/java']
        resources.srcDirs = ['src/modernTest/resources']
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                thaumcraft {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // Temurin 17.0.15 on Windows crashed in C2 while compiling FluidState.tick
            // (hs_err_pid17428.log). Keep the dev client on C1 until that runtime is
            // replaced/verified; this does not change the packaged mod or server JVM.
            def safeClientJit = providers.gradleProperty('safeClientJit')
                    .map { it.toBoolean() }
                    .getOrElse(System.getProperty('os.name').startsWith('Windows'))
            if (safeClientJit) {
                jvmArgs '-XX:TieredStopAtLevel=1'
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('build/gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
            mods { thaumcraft { source sourceSets.test } }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/modern/resources/')
        }
    }
}

repositories {
    // Add mod integration repositories here as systems are migrated.
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

def wandPartAssetIds = [
        'wand_cap_iron',
        'wand_cap_gold',
        'wand_cap_thaumium',
        'wand_cap_copper',
        'wand_cap_silver',
        'wand_cap_silver_inert',
        'wand_cap_thaumium_inert',
        'wand_cap_void',
        'wand_cap_void_inert',
        'wand_rod_greatwood',
        'wand_rod_obsidian',
        'wand_rod_silverwood',
        'wand_rod_ice',
        'wand_rod_quartz',
        'wand_rod_reed',
        'wand_rod_blaze',
        'wand_rod_bone',
        'staff_rod_greatwood',
        'staff_rod_obsidian',
        'staff_rod_silverwood',
        'staff_rod_ice',
        'staff_rod_quartz',
        'staff_rod_reed',
        'staff_rod_blaze',
        'staff_rod_bone',
        'staff_rod_primal'
]

tasks.register('validateWandPartAssets') {
    group = 'verification'
    description = 'Validates item models and textures for every registered wand part.'

    doLast {
        def parser = new groovy.json.JsonSlurper()
        wandPartAssetIds.each { id ->
            def modelFile = file("src/modern/resources/assets/thaumcraft/models/item/${id}.json")
            def textureFile = file("src/modern/resources/assets/thaumcraft/textures/item/${id}.png")
            def legacyTextureFile = file("src/modern/resources/assets/thaumcraft/textures/items/${id}.png")

            if (!modelFile.isFile()) {
                throw new GradleException("Missing wand-part model: ${modelFile}")
            }
            if (!textureFile.isFile()) {
                throw new GradleException("Missing wand-part texture: ${textureFile}")
            }
            if (legacyTextureFile.exists()) {
                throw new GradleException("Legacy wand-part texture path still exists: ${legacyTextureFile}")
            }

            def model = parser.parse(modelFile)
            def expectedTexture = "thaumcraft:item/${id}"
            if (model?.textures?.layer0 != expectedTexture) {
                throw new GradleException("Broken wand-part model ${modelFile}: layer0 must be ${expectedTexture}")
            }
        }

        ['wand_cap_silver', 'wand_cap_thaumium', 'wand_cap_void'].each { id ->
            def animationFile = file("src/modern/resources/assets/thaumcraft/textures/item/${id}.png.mcmeta")
            if (!animationFile.isFile()) {
                throw new GradleException("Missing animated wand-cap metadata: ${animationFile}")
            }
        }
    }
}

tasks.register('validateResearchIcons') {
    group = 'verification'
    description = 'Checks direct book texture paths and PNG dimensions before packaging.'
    doLast {
        def nodes = new groovy.json.JsonSlurper().parse(file('src/modern/resources/assets/thaumcraft/research/tree.json'))
        nodes.findAll { it.icon }.each { node ->
            def parts = node.icon.split(':', 2)
            def texture = file("src/modern/resources/assets/${parts[0]}/${parts[1]}")
            if (!texture.isFile()) throw new GradleException("Missing research icon ${node.key}: ${node.icon}")
            def bytes = texture.bytes
            if (bytes.length < 24 || bytes[0] != (byte)0x89 || bytes[1] != (byte)0x50)
                throw new GradleException("Invalid PNG research icon: ${node.icon}")
            def dimensions = java.nio.ByteBuffer.wrap(bytes, 16, 8)
            if (dimensions.getInt() != node.iconWidth || dimensions.getInt() != node.iconHeight)
                throw new GradleException("Incorrect research icon dimensions: ${node.key}")
        }
        nodes.findAll { it.item?.startsWith('thaumcraft:') }.each { node ->
            def name = node.item.split(':', 2)[1]
            if (!file("src/modern/resources/assets/thaumcraft/models/item/${name}.json").isFile())
                throw new GradleException("Missing research item model ${node.key}: ${node.item}")
        }
        logger.lifecycle("Validated ${nodes.count { it.icon }} research PNGs.")
        def illustrations = new HashSet<String>()
        ['en_us', 'ru_ru'].each { language ->
            def strings = new groovy.json.JsonSlurper().parse(file("src/modern/resources/assets/thaumcraft/lang/${language}.json"))
            strings.values().each { value ->
                (value =~ /<IMG>(.*?)<\/IMG>/).each { match -> illustrations.add(match[1]) }
            }
        }
        illustrations.each { spec ->
            def p = spec.split(':')
            def texture = file("src/modern/resources/assets/${p[0]}/${p[1]}")
            if (!texture.isFile()) throw new GradleException("Missing book illustration: ${spec}")
            def image = javax.imageio.ImageIO.read(texture)
            if (image == null) throw new GradleException("Invalid book illustration: ${spec}")
            def u = p[2] as int; def v = p[3] as int
            def w = p[4] as int; def h = p[5] as int
            if (image.width < 256 && w > image.width) {
                u = (int)(u * image.width / 256); v = (int)(v * image.height / 256)
                w = Math.round(w * image.width / 256F); h = Math.round(h * image.height / 256F)
            }
            if (u < 0 || v < 0 || w <= 0 || h <= 0 || u+w > image.width || v+h > image.height)
                throw new GradleException("Book illustration UV outside PNG: ${spec}")
        }
        if (!file('src/modern/resources/assets/thaumcraft/textures/gui/gui_researchbook_overlay.png').isFile())
            throw new GradleException('Missing original recipe page overlay')
        logger.lifecycle("Validated ${illustrations.size()} book illustration crops.")
    }
}

tasks.register('validateFluxRegistration') {
    group = 'verification'
    description = 'Rejects duplicate flux block registrations before launching Minecraft.'
    doLast {
        def sources = fileTree('src/modern/java') { include '**/*.java' }
        ['flux_gas', 'flux_goo'].each { name ->
            def owners = []
            sources.each { source ->
                def pattern = ~("\\b(?:ModOres\\.)?BLOCKS\\s*\\.register\\s*\\(\\s*\"${name}\"")
                (source.getText('UTF-8') =~ pattern).each { owners.add(source.path) }
            }
            if (owners.size() != 1)
                throw new GradleException("Expected one ${name} block registration, found ${owners.size()}: ${owners}")
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('validateResearchIcons')
    dependsOn tasks.named('validateFluxRegistration')
    dependsOn tasks.named('validateWandPartAssets')

    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    // Keep legacy source/resources excluded globally, but package exact TC4 assets
    // that the modern renderer intentionally reuses.
    from('src/main/resources/assets/thaumcraft/textures/misc/nodes.png') {
        into 'assets/thaumcraft/textures/misc'
    }
    from('src/main/resources/assets/thaumcraft/textures/blocks/infusedorestone.png') {
        into 'assets/thaumcraft/textures/block'
    }
    from('src/main/resources/assets/thaumcraft/textures/blocks/infusedore.png') {
        into 'assets/thaumcraft/textures/block'
    }
    from('src/main/resources/assets/thaumcraft/textures/blocks/infusedore.png.mcmeta') {
        into 'assets/thaumcraft/textures/block'
    }
    from('src/main/resources/assets/thaumcraft/sounds/zap1.ogg') {
        into 'assets/thaumcraft/sounds'
    }
    from('src/main/resources/assets/thaumcraft/sounds/zap2.ogg') {
        into 'assets/thaumcraft/sounds'
    }

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
