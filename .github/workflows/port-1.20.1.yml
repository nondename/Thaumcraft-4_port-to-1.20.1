name: Forge 1.20.1 Port

on:
  push:
    branches:
      - port/1.20.1-bootstrap
      - '1.20.1'
  pull_request:
    branches:
      - main
      - '1.20.1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x mod/gradlew

      - name: Build bootstrap
        working-directory: mod
        run: ./gradlew --no-daemon build

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thaumcraft-1.20.1-bootstrap
          path: mod/build/libs/*.jar
          if-no-files-found: error
